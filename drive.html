<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Автосим — свободная езда</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101418; font-family: system-ui, sans-serif; }
  #app { width: 100%; height: 100%; display: block; touch-action: none; }
  #hud {
    position: fixed; top: 10px; left: 10px; z-index: 10; color: #eee;
    background: rgba(0,0,0,.65); border-radius: 10px; padding: 10px 12px;
    font-size: 14px; line-height: 1.5; max-width: 300px; user-select: none;
  }
  #hud .speed { font-size: 26px; font-weight: 700; }
  #hit { color: #ff6b6b; font-weight: 700; }
  #btns { position: fixed; top: 10px; right: 10px; z-index: 10; display: flex; gap: 8px; }
  #btns button, .tbtn {
    background: rgba(0,0,0,.65); color: #fff; border: 1px solid #555; border-radius: 10px;
    font-size: 15px; padding: 10px 12px; cursor: pointer;
  }
  #btns button:active, .tbtn:active { background: #333; }
  #touch { position: fixed; bottom: 14px; left: 0; right: 0; z-index: 10;
    display: none; justify-content: space-between; padding: 0 14px; pointer-events: none; }
  #touch .grp { display: flex; gap: 10px; pointer-events: auto; }
  .tbtn { width: 72px; height: 72px; font-size: 26px; border-radius: 16px; touch-action: none; }
  #map { position: fixed; bottom: 14px; right: 14px; z-index: 10; border-radius: 10px;
    background: rgba(0,0,0,.6); border: 1px solid #444; }
  #start {
    position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.75); color: #fff; text-align: center; padding: 20px;
  }
  #start button { font-size: 20px; padding: 14px 26px; border-radius: 12px; border: none; background: #2f7fd1; color: #fff; }
  @media (max-width: 700px) {
    #hud { font-size: 12px; max-width: 220px; }
    #hud .speed { font-size: 22px; }
    #map { width: 110px !important; height: 110px !important; bottom: 100px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="app"></canvas>

<div id="hud">
  <div><span class="speed" id="speed">0</span> км/ч <span id="hit"></span></div>
  <div style="opacity:.7;font-size:12px">W/▲ газ · S/▼ тормоз/задний · A/D руль · C камера · R на дорогу<br>Клик по земле или мини-карте — перенести машинку</div>
</div>

<div id="btns">
  <button id="bCam">🎥 Камера</button>
  <button id="bReset">📍 На дорогу</button>
</div>

<div id="touch">
  <div class="grp">
    <button class="tbtn" id="mL">◀</button>
    <button class="tbtn" id="mR">▶</button>
  </div>
  <div class="grp">
    <button class="tbtn" id="mB">▼</button>
    <button class="tbtn" id="mG">▲</button>
  </div>
</div>

<canvas id="map" width="150" height="150"></canvas>

<div id="start">
  <div>
    <h2>Автосим по Нижнему Новгороду</h2>
    <p>Свободная езда везде, кроме зданий<br>Велосипедная модель · камеры: преследование / капот / сверху</p>
    <button id="go">▶ Старт</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ---------- базовый рендер ----------
const canvas = document.getElementById('app');
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !isTouch, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, isTouch ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101418);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.5, 12000);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(100, 200, 50);
scene.add(sun);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
if (isTouch) document.getElementById('touch').style.display = 'flex';

// ---------- загрузка мира, дорог (спавн/карта) и зданий (столкновения) ----------
const [gltf, graph, obstacles] = await Promise.all([
  new GLTFLoader().loadAsync('./output/city.glb'),
  fetch('./output/road-graph.json').then((r) => r.json()).catch(() => null),
  fetch('./output/obstacles.json').then((r) => r.json()).catch(() => null),
]);
scene.add(gltf.scene);
const edges = graph?.edges || [];

// ---------- столкновения со зданиями: равномерная сетка 40 м ----------
const CELL = 40, grid = new Map();
const polys = obstacles?.polys || [];
const gkey = (cx, cz) => cx + ':' + cz;
polys.forEach((poly, idx) => {
  const [bx0, bz0, bx1, bz1] = poly.b;
  for (let cx = Math.floor(bx0 / CELL); cx <= Math.floor(bx1 / CELL); cx++)
    for (let cz = Math.floor(bz0 / CELL); cz <= Math.floor(bz1 / CELL); cz++) {
      const k = gkey(cx, cz);
      if (!grid.has(k)) grid.set(k, []);
      grid.get(k).push(idx);
    }
});
function pointInPoly(x, z, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, zi] = pts[i], [xj, zj] = pts[j];
    if ((zi > z) !== (zj > z) && x < ((xj - xi) * (z - zi)) / (zj - zi) + xi) inside = !inside;
  }
  return inside;
}
// круг радиуса r упирается в здание?
function hitsBuilding(x, z, r) {
  const cx0 = Math.floor((x - r) / CELL), cx1 = Math.floor((x + r) / CELL);
  const cz0 = Math.floor((z - r) / CELL), cz1 = Math.floor((z + r) / CELL);
  const seen = new Set();
  for (let cx = cx0; cx <= cx1; cx++)
    for (let cz = cz0; cz <= cz1; cz++) {
      for (const idx of grid.get(gkey(cx, cz)) || []) {
        if (seen.has(idx)) continue;
        seen.add(idx);
        const poly = polys[idx];
        if (x + r < poly.b[0] || x - r > poly.b[2] || z + r < poly.b[1] || z - r > poly.b[3]) continue;
        if (pointInPoly(x, z, poly.p)) return true;
        // тонкие стены: вершина полигона внутри круга
        for (const [px, pz] of poly.p) {
          if ((px - x) ** 2 + (pz - z) ** 2 < r * r) return true;
        }
      }
    }
  return false;
}
// машина 4.2×1.9: проверяем 5 точек (центр + углы кузова)
function carCollides(x, z, yaw) {
  const fx = Math.cos(yaw), fz = -Math.sin(yaw); // вперёд
  const rx = -fz, rz = fx; // вправо
  const pts = [[x, z]];
  for (const [lf, ls] of [[1.9, 0.85], [1.9, -0.85], [-1.9, 0.85], [-1.9, -0.85]])
    pts.push([x + fx * lf + rx * ls, z + fz * lf + rz * ls]);
  return pts.some(([px, pz]) => hitsBuilding(px, pz, 0.3));
}

// ---------- машинка ----------
function makeCar(color) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(4.2, 1.1, 1.9),
    new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.3 }));
  body.position.y = 1.35; g.add(body);
  const cab = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.8, 1.7),
    new THREE.MeshStandardMaterial({ color: 0x222831, roughness: 0.3 }));
  cab.position.set(-0.2, 2.2, 0); g.add(cab);
  const wg = new THREE.CylinderGeometry(0.42, 0.42, 0.35, 12);
  wg.rotateX(Math.PI / 2);
  const wm = new THREE.MeshStandardMaterial({ color: 0x111111 });
  for (const [x, z] of [[1.4, 0.95], [1.4, -0.95], [-1.4, 0.95], [-1.4, -0.95]]) {
    const w = new THREE.Mesh(wg, wm); w.position.set(x, 0.42, z); g.add(w);
  }
  return g;
}
const car = makeCar(0x2f7fd1);
const wheelFL = car.children[3], wheelFR = car.children[2];
scene.add(car);

// ---------- боты-трафик по дорогам (декорация) ----------
const bots = [];
if (edges.length) {
  const adj = new Map();
  for (const e of edges) {
    if (!adj.has(e.from)) adj.set(e.from, []);
    adj.get(e.from).push(e.id);
    const cum = [0];
    for (let i = 1; i < e.pts.length; i++)
      cum.push(cum[i - 1] + Math.hypot(e.pts[i][0] - e.pts[i - 1][0], e.pts[i][1] - e.pts[i - 1][1]));
    e.cum = cum;
  }
  const edgeById = new Map(edges.map((e) => [e.id, e]));
  bots.adj = adj; bots.edgeById = edgeById;
  for (let i = 0; i < 4; i++) {
    const m = makeCar(0xc0392b);
    scene.add(m);
    const e = edges[(Math.random() * edges.length) | 0];
    bots.push({ mesh: m, edge: e.id, s: Math.random() * e.length, speed: 8 });
  }
}
function edgePoint(e, s, lat) {
  const c = e.cum;
  let i = 1;
  while (i < c.length - 1 && c[i] < s) i++;
  const f = (s - c[i - 1]) / ((c[i] - c[i - 1]) || 1);
  const [x0, z0] = e.pts[i - 1], [x1, z1] = e.pts[i];
  const dx = x1 - x0, dz = z1 - z0, len = Math.hypot(dx, dz) || 1;
  return { x: x0 + dx * f + (dz / len) * lat, z: z0 + dz * f + (-dx / len) * lat, dx, dz };
}
function stepBots(dt) {
  for (const b of bots) {
    if (b.mesh === undefined) continue;
    const e = bots.edgeById.get(b.edge);
    b.speed += Math.min(e.maxspeed / 3.6 * 0.85 - b.speed, 3 * dt);
    b.s += b.speed * dt;
    if (b.s >= e.length) {
      const outs = bots.adj.get(e.to) || [];
      b.edge = outs.length ? outs[(Math.random() * outs.length) | 0] : e.id;
      b.s = 0;
    }
    const p = edgePoint(bots.edgeById.get(b.edge), b.s, bots.edgeById.get(b.edge).laneOff ?? 1.75);
    b.mesh.position.set(p.x, 1.0, p.z);
    b.mesh.rotation.y = Math.atan2(-p.dz, p.dx);
  }
}

// ---------- состояние: велосипедная модель ----------
// x,z — центр задней оси; yaw: forward=(cos yaw, −sin yaw); L — база.
const S = {
  x: 0, z: 0, yaw: 0, speed: 0, steer: 0,
  camMode: 0, hitT: 0,
};
const L = 2.8, MAX_STEER = 0.55, MAX_FWD = 33, MAX_REV = -8;
function spawnOnRoad() {
  if (!edges.length) { S.x = 0; S.z = 0; S.yaw = 0; return; }
  let best = edges[0];
  for (const e of edges) if (e.length > best.length) best = e;
  const i = Math.floor(best.pts.length / 2);
  const [x0, z0] = best.pts[Math.max(0, i - 1)], [x1, z1] = best.pts[i];
  S.x = (x0 + x1) / 2; S.z = (z0 + z1) / 2;
  S.yaw = Math.atan2(-(z1 - z0), x1 - x0);
  S.speed = 0; S.steer = 0;
}
function nearestRoad() {
  if (!edges.length) return;
  let bx = S.x, bz = S.z, bd = 1e18, byaw = S.yaw;
  for (const e of edges) {
    for (let i = 1; i < e.pts.length; i++) {
      const [x0, z0] = e.pts[i - 1], [x1, z1] = e.pts[i];
      const dx = x1 - x0, dz = z1 - z0, L2 = dx * dx + dz * dz || 1;
      const t = Math.min(1, Math.max(0, ((S.x - x0) * dx + (S.z - z0) * dz) / L2));
      const px = x0 + dx * t, pz = z0 + dz * t;
      const d = (S.x - px) ** 2 + (S.z - pz) ** 2;
      if (d < bd) { bd = d; bx = px; bz = pz; byaw = Math.atan2(-dz, dx); }
    }
  }
  if (!carCollides(bx, bz, byaw)) { S.x = bx; S.z = bz; }
  S.yaw = byaw; S.speed = 0; S.steer = 0;
}
// перенос в точку: занято зданием — ищем свободное рядом, иначе «занято»
function teleport(x, z) {
  const m = 60;
  x = Math.max(mmBox.x0 - m, Math.min(mmBox.x1 + m, x));
  z = Math.max(mmBox.z0 - m, Math.min(mmBox.z1 + m, z));
  if (!carCollides(x, z, S.yaw)) { S.x = x; S.z = z; }
  else {
    let placed = false;
    for (let r = 3; r <= 25 && !placed; r += 2)
      for (let a = 0; a < 12 && !placed; a++) {
        const t = (a / 12) * Math.PI * 2;
        const px = x + Math.cos(t) * r, pz = z + Math.sin(t) * r;
        if (!carCollides(px, pz, S.yaw)) { S.x = px; S.z = pz; placed = true; }
      }
    if (!placed) { S.hitT = 1.5; elHit.textContent = 'занято'; return; }
  }
  S.speed = 0; S.steer = 0;
  car.position.set(S.x, 1.0, S.z);
  drawMap();
}
spawnOnRoad();

// ---------- ввод ----------
const keys = new Set();
addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (['arrowup', 'arrowdown', ' '].includes(k)) e.preventDefault();
  keys.add(k);
  if (k === 'c' || k === 'с') S.camMode = (S.camMode + 1) % 3;
  if (k === 'r' || k === 'к') nearestRoad();
});
addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));
function bindHold(id, key) {
  const el = document.getElementById(id);
  const on = (e) => { e.preventDefault(); keys.add(key); };
  const off = (e) => { e.preventDefault(); keys.delete(key); };
  el.addEventListener('touchstart', on, { passive: false });
  el.addEventListener('touchend', off); el.addEventListener('touchcancel', off);
  el.addEventListener('mousedown', on); el.addEventListener('mouseup', off); el.addEventListener('mouseleave', off);
}
bindHold('mG', 'w'); bindHold('mB', 's'); bindHold('mL', 'a'); bindHold('mR', 'd');
document.getElementById('bCam').onclick = () => { S.camMode = (S.camMode + 1) % 3; };
document.getElementById('bReset').onclick = nearestRoad;

// клик по мини-карте — перенос
document.getElementById('map').addEventListener('click', (ev) => {
  if (!started) return;
  const r = ev.target.getBoundingClientRect();
  const fx = (ev.clientX - r.left) / r.width, fz = (ev.clientY - r.top) / r.height;
  teleport(mmBox.x0 + fx * (mmBox.x1 - mmBox.x0), mmBox.z0 + fz * (mmBox.z1 - mmBox.z0));
});
// клик/тап по 3D-сцене — перенос в точку (рейкаст по городу, иначе плоскость y=0)
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
canvas.addEventListener('click', (ev) => {
  if (!started) return;
  const r = canvas.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObject(gltf.scene, true);
  if (hits.length) { teleport(hits[0].point.x, hits[0].point.z); return; }
  const t = -ray.ray.origin.y / ray.ray.direction.y;
  if (t > 0 && isFinite(t))
    teleport(ray.ray.origin.x + ray.ray.direction.x * t, ray.ray.origin.z + ray.ray.direction.z * t);
});

const gasOn = () => keys.has('w') || keys.has('ц') || keys.has('arrowup');
const brakeOn = () => keys.has('s') || keys.has('ы') || keys.has('arrowdown');
const steerIn = () => ((keys.has('a') || keys.has('ф') || keys.has('arrowleft') ? 1 : 0) - (keys.has('d') || keys.has('в') || keys.has('arrowright') ? 1 : 0));

// ---------- HUD ----------
const elSpeed = document.getElementById('speed'), elHit = document.getElementById('hit');

// ---------- миникарта ----------
const mm = document.getElementById('map').getContext('2d');
const mmBox = (() => {
  if (obstacles?.meta?.bounds) {
    const [x0, z0, x1, z1] = obstacles.meta.bounds;
    return { x0, x1, z0, z1 };
  }
  let x0 = -1300, x1 = 1300, z0 = -1300, z1 = 1300;
  return { x0, x1, z0, z1 };
})();
function drawMap() {
  const W = 150, H = 150;
  mm.clearRect(0, 0, W, H);
  const sx = (x) => ((x - mmBox.x0) / (mmBox.x1 - mmBox.x0)) * W;
  const sz = (z) => ((z - mmBox.z0) / (mmBox.z1 - mmBox.z0)) * H;
  mm.strokeStyle = '#666'; mm.lineWidth = 1; mm.beginPath();
  for (const e of edges) {
    mm.moveTo(sx(e.pts[0][0]), sz(e.pts[0][1]));
    for (let i = 1; i < e.pts.length; i++) mm.lineTo(sx(e.pts[i][0]), sz(e.pts[i][1]));
  }
  mm.stroke();
  mm.fillStyle = '#fff'; mm.beginPath(); mm.arc(sx(S.x), sz(S.z), 3, 0, 7); mm.fill();
  mm.fillStyle = '#c0392b';
  for (const b of bots) {
    if (!b.mesh) continue;
    mm.beginPath(); mm.arc(sx(b.mesh.position.x), sz(b.mesh.position.z), 2, 0, 7); mm.fill();
  }
}

// ---------- главный цикл: велосипедная модель ----------
const clock = new THREE.Clock();
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
let mapT = 0;

function step(dt) {
  // руль: на скорости угол меньше (иначе разворот юлой), доворот плавный
  const spd = Math.abs(S.speed);
  const maxEff = MAX_STEER / (1 + spd * 0.09); // 0.55 на месте → ~0.29 на 36 км/ч → ~0.15 на 120
  const target = steerIn() * maxEff;
  const rate = 2.2;
  S.steer += Math.max(-rate * dt, Math.min(rate * dt, target - S.steer));

  // газ / тормоз / задний ход
  if (gasOn()) S.speed += 5.5 * dt;
  if (brakeOn()) S.speed -= (S.speed > 0.5 ? 10 : 4) * dt;
  S.speed -= S.speed * 0.35 * dt; // сопротивление
  if (!gasOn() && !brakeOn() && Math.abs(S.speed) < 0.15) S.speed = 0;
  S.speed = Math.max(MAX_REV, Math.min(MAX_FWD, S.speed));

  // кинематика велосипеда
  if (Math.abs(S.speed) > 0.01) {
    S.yaw += (S.speed / L) * Math.tan(S.steer) * dt;
  }
  const fx = Math.cos(S.yaw), fz = -Math.sin(S.yaw);
  let nx = S.x + fx * S.speed * dt, nz = S.z + fz * S.speed * dt;

  // здания: скольжение по осям, иначе стоим
  if (carCollides(nx, nz, S.yaw)) {
    if (!carCollides(nx, S.z, S.yaw)) { nz = S.z; }
    else if (!carCollides(S.x, nz, S.yaw)) { nx = S.x; }
    else { nx = S.x; nz = S.z; S.speed *= 0.3; }
    S.hitT = 1.2;
    elHit.textContent = 'стена';
  }
  // боты — мягкие круги r=2.6
  for (const b of bots) {
    if (!b.mesh) continue;
    const d2 = (b.mesh.position.x - nx) ** 2 + (b.mesh.position.z - nz) ** 2;
    if (d2 < 2.6 * 2.6) { nx = S.x; nz = S.z; S.speed *= 0.5; S.hitT = 1.2; elHit.textContent = 'машина!'; break; }
  }
  // границы карты
  const m = 60;
  nx = Math.max(mmBox.x0 - m, Math.min(mmBox.x1 + m, nx));
  nz = Math.max(mmBox.z0 - m, Math.min(mmBox.z1 + m, nz));
  S.x = nx; S.z = nz;

  car.position.set(S.x, 1.0, S.z);
  car.rotation.y = S.yaw;
  car.rotation.z = -S.steer * 0.08;
  if (wheelFL) wheelFL.rotation.x = wheelFR.rotation.x = -S.steer * 0.9;

  stepBots(dt);

  // камеры
  if (S.camMode === 0) { // преследование
    camPos.set(S.x - fx * 11, 5.5, S.z - fz * 11);
    camera.position.lerp(camPos, 1 - Math.pow(0.001, dt));
    camLook.set(S.x + fx * 8, 1.5, S.z + fz * 8);
    camera.lookAt(camLook);
  } else if (S.camMode === 1) { // капот
    camera.position.set(S.x + fx * 0.6, 2.3, S.z + fz * 0.6);
    camera.lookAt(S.x + fx * 30, 1.8, S.z + fz * 30);
  } else { // сверху
    camPos.set(S.x, 130, S.z + 1);
    camera.position.lerp(camPos, 1 - Math.pow(0.001, dt));
    camera.lookAt(S.x, 0, S.z);
  }

  elSpeed.textContent = Math.round(Math.abs(S.speed) * 3.6);
  if (S.hitT > 0) { S.hitT -= dt; if (S.hitT <= 0) elHit.textContent = ''; }
  mapT += dt;
  if (mapT > 0.25) { mapT = 0; drawMap(); }
}

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (started) step(dt);
  else {
    const t = performance.now() / 8000;
    camera.position.set(Math.cos(t) * 1500, 900, Math.sin(t) * 1500);
    camera.lookAt(0, 0, 0);
  }
  renderer.render(scene, camera);
});
